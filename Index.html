<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>To Do List</h1>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Enter task here">
            <button id="addBtn">Add</button>
        </div>
       <!-- COLOUR TAG PICKER -->
        <div class="colour-tag-section">
            <label>Tag:</label>
            <span class="colour-swatch selected" data-colour="#cccccc" style="background:#ccc;" title="None"></span>
            <span class="colour-swatch" data-colour="#e74c3c" style="background:#e74c3c;" title="Red"></span>
            <span class="colour-swatch" data-colour="#e67e22" style="background:#e67e22;" title="Orange"></span>
            <span class="colour-swatch" data-colour="#f1c40f" style="background:#f1c40f;" title="Yellow"></span>
            <span class="colour-swatch" data-colour="#2ecc71" style="background:#2ecc71;" title="Green"></span>
            <span class="colour-swatch" data-colour="#3498db" style="background:#3498db;" title="Blue"></span>
            <span class="colour-swatch" data-colour="#9b59b6" style="background:#9b59b6;" title="Purple"></span>
        </div>
        <div class="filters">
           <button class="filter-btn active" data-filter="all">All</button>
<button class="filter-btn" data-filter="active">Active</button>
<button class="filter-btn" data-filter="completed">Completed</button>

        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
